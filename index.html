<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Cycle</title>
<meta name="theme-color" content="#111315">
<meta name="description" content="GZCLP and Boring But Big lifting tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>


<div class="wrap" id="app"></div>
<div class="dock">
  <div class="timer" id="timer" hidden>
    <div class="clock" id="clock">0:00</div>
    <div class="lab" id="tlab">Rest</div>
    <button class="pm" data-act="t-30" aria-label="Subtract 30 seconds">−30</button>
    <button class="pm" data-act="t+30" aria-label="Add 30 seconds">+30</button>
    <button class="btn small ghost" data-act="tskip">Skip</button>
    <div class="bar" id="tbar"></div>
  </div>
  <nav id="nav">
    <button data-act="view" data-v="today" class="on">Workout</button>
    <button data-act="view" data-v="history">History</button>
    <button data-act="view" data-v="setup">Setup</button>
  </nav>
</div>
<div id="sheet"></div>

<script src="app.js"></script>
</body>
</html>
